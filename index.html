<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Pinger</title>
<style>
  :root{
    --bg:#ffffff; --soft:#f6f7f9; --line:#e3e6eb; --text:#1a1d23; --muted:#6b7280;
    --green:#16a34a; --green-bg:#e8f7ee; --red:#dc2626; --red-bg:#fdeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:32px 16px 80px}
  h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 24px}
  details.plat{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:var(--bg)}
  details.plat>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:18px}
  details.plat>summary::-webkit-details-marker{display:none}
  details.plat>summary .name{font-weight:600;font-size:18px;flex:1}
  .pill{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
  .pill.ok{background:var(--green-bg);color:var(--green)}
  .pill.bad{background:var(--red-bg);color:var(--red)}
  .arrow{color:var(--muted);transition:transform .15s}
  details.plat[open]>summary .arrow{transform:rotate(90deg)}
  .body{padding:4px 18px 20px;display:grid;gap:16px}
  label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
  input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  input:focus,select:focus,textarea:focus{outline:2px solid #1a1d23;outline-offset:-1px}
  textarea{resize:vertical;min-height:70px}
  button{font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 18px;cursor:pointer}
  button:hover{background:var(--soft)}
  button.primary{background:#1a1d23;color:#fff;border-color:#1a1d23}
  button.primary:hover{background:#000}
  button.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:11px 6px}
  button:disabled{opacity:.5;cursor:default}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  pre{margin:0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .result{padding:12px 14px;border-radius:10px;max-height:340px;overflow:auto}
  .result.ok{background:var(--green-bg);color:#14532d}
  .result.bad{background:var(--red-bg);color:#7f1d1d}
  .result.wait{background:var(--soft);color:var(--muted)}
  .list{display:grid;gap:8px}
  .list details{border-radius:10px;padding:10px 12px}
  .list details.ok{background:var(--green-bg);color:#14532d}
  .list details.bad{background:var(--red-bg);color:#7f1d1d}
  .list details.wait{background:var(--soft);color:var(--muted)}
  .list summary{cursor:pointer;font-size:14px}
  .list pre{margin-top:8px}
  hr{border:none;border-top:1px solid var(--line);margin:2px 0}
  h3{margin:0;font-size:15px}
  .msgs{display:grid;gap:8px;max-height:360px;overflow:auto}
  .msgs:empty{display:none}
  .msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:15px;max-width:92%}
  .msg.user{background:var(--soft);justify-self:end}
  .msg.bot{background:var(--green-bg);border:1px solid #bfe8cf}
  .msg.err{background:var(--red-bg);border:1px solid #f5c2c2;color:#7f1d1d;max-width:100%;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
  .compose{display:grid;gap:8px}
  .compose .row{display:flex;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .chk input{width:auto}
  .more>summary{cursor:pointer;color:var(--muted);font-size:14px}
  footer{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Model Pinger</h1>
  <p class="sub">Open a platform, paste your API key, pick a model and press Ping. You get the platform's raw response. Green means it replied, red means it did not.</p>

  <main id="platforms"></main>

  <details class="more">
    <summary>Clear saved data</summary>
    <p><button id="clearAll">Clear everything saved in this browser</button></p>
  </details>

  <footer>Your key is sent only to this site's own server and the platform you test. It is never stored in the code.</footer>
</div>

<script>
// To add a platform, add it here AND in api/relay.js (ALLOWED list).
const PLATFORMS = [
  {id:'justwoker',   name:'Just Woker',  url:'https://api.justwoker.icu'},
  {id:'conduit',     name:'Conduit',     url:'https://conduit.ozdoev.net'},
  {id:'tabitoken',   name:'TabiToken',   url:'https://tabitoken.com'},
  {id:'kktoken',     name:'KKToken',     url:'https://kktoken.cc'},
  {id:'agentrouter', name:'AgentRouter', url:'https://agentrouter.org'},
];
const MODELS = [
  'claude-fable-5-1','claude-fable-5','claude-opus-5-5','claude-opus-5',
  'claude-opus-4-8','claude-sonnet-5-5','claude-haiku-5-5',
];

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS='modelPinger.v4';
let store={}; try{store=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch{store={}}
store.keys??={}; store.remember??={};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch{}};
const chats={};

function cardHTML(p){
  const rem=!!store.remember[p.id];
  return `
  <details class="plat" data-p="${p.id}">
    <summary><span class="name">${esc(p.name)}</span><span class="pill" data-pill>Not tested</span><span class="arrow">&#9656;</span></summary>
    <div class="body">
      <label>API key
        <input data-f="key" type="password" value="${esc(rem?(store.keys[p.id]||''):'')}" placeholder="Paste your API key" autocomplete="off" spellcheck="false">
      </label>
      <label class="chk"><input data-f="remember" type="checkbox" ${rem?'checked':''}> Remember this key on this device</label>

      <label>Model
        <select data-f="model">
          ${MODELS.map(m=>`<option value="${m}">${m}</option>`).join('')}
          <option value="__other">Other (type a model name)...</option>
        </select>
      </label>
      <input data-f="other" placeholder="Type the model name" hidden autocomplete="off" spellcheck="false">

      <div class="actions">
        <button class="primary" data-act="ping">Ping</button>
        <button class="link" data-act="testall">Test all models</button>
      </div>
      <div class="result" data-result hidden><pre></pre></div>
      <div class="list" data-list></div>

      <hr>
      <h3>Chat with this model</h3>
      <div class="msgs" data-msgs></div>
      <div class="compose">
        <textarea data-f="msg" placeholder="Type a message..."></textarea>
        <div class="row"><button class="primary" data-act="send">Send</button><button data-act="clearchat">Clear chat</button></div>
      </div>
      <details class="more" data-chatraw hidden><summary>Show raw response</summary><div class="result wait" style="margin-top:8px"><pre></pre></div></details>
    </div>
  </details>`;
}
$('#platforms').innerHTML=PLATFORMS.map(cardHTML).join('');

// ---------- Network (goes through this site's own /api/relay, so the browser never blocks it) ----------
const getModel=card=>{const s=$('[data-f=model]',card).value;return s==='__other'?$('[data-f=other]',card).value.trim():s};
function extractText(j){
  if(!j) return '';
  if(Array.isArray(j.content)) return j.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return j.choices?.[0]?.message?.content||'';
}

async function call(card,model,messages,max){
  const key=$('[data-f=key]',card).value.trim();
  if(!key) return {ok:false,status:0,ms:0,cfg:'Paste your API key first.'};
  if(!model) return {ok:false,status:0,ms:0,cfg:'Choose a model first.'};
  const p=PLATFORMS.find(x=>x.id===card.dataset.p);
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),65000); const t0=performance.now();
  try{
    const res=await fetch('/api/relay',{
      method:'POST', headers:{'content-type':'application/json'}, signal:ctrl.signal,
      body:JSON.stringify({base:p.url,key,payload:{model,max_tokens:max,messages}}),
    });
    const text=await res.text(); let json=null; try{json=JSON.parse(text)}catch{}
    return {ok:res.ok,status:res.status,ms:Math.round(performance.now()-t0),text,json,viaRelay:res.headers.get('x-relay')==='1',
      style:res.headers.get('x-relay-style'),tried:+(res.headers.get('x-relay-tried')||0),rejected:res.headers.get('x-relay-rejected')==='1'};
  }catch(e){
    return {ok:false,status:0,ms:Math.round(performance.now()-t0),net:e.name+': '+e.message};
  }finally{clearTimeout(timer)}
}

// Raw output only: status line + the body exactly as the platform sent it.
function raw(r){
  if(r.cfg) return r.cfg;
  if(r.net) return 'No response received.\nBrowser error: '+r.net;
  let s='HTTP '+r.status+'  ('+r.ms+' ms)\n';
  if(r.style) s+=r.rejected
    ? 'Tried '+r.tried+' ways of sending your key. The platform rejected all of them, so it does not accept this key.\n'
    : 'Sent as: '+r.style+(r.tried>1?'  (earlier styles were rejected)':'')+'\n';
  s+='\n'+(r.json?JSON.stringify(r.json,null,2):(r.text||'(empty body)'));
  if(!r.viaRelay) s='This page is not running on Vercel with its api/relay.js file, so nothing reached the platform.\n\n'+s;
  return s;
}

function setPill(card,ok,text){const p=$('[data-pill]',card);p.className='pill '+(ok?'ok':'bad');p.textContent=text}
async function pool(items,n,fn){const q=[...items];await Promise.all(Array.from({length:Math.min(n,q.length)},async()=>{while(q.length)await fn(q.shift())}))}
const PING=[{role:'user',content:'Reply with the single word: pong'}];

// ---------- Chat ----------
function renderChat(card){
  const k=card.dataset.p+'::'+getModel(card), c=chats[k]||{ui:[]}, box=$('[data-msgs]',card);
  box.innerHTML=c.ui.map(m=>`<div class="msg ${m.err?'err':m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('');
  box.scrollTop=box.scrollHeight;
}
async function send(card){
  const model=getModel(card), k=card.dataset.p+'::'+model, ta=$('[data-f=msg]',card), text=ta.value.trim();
  if(!text) return;
  const c=chats[k]??={hist:[],ui:[]};
  c.hist.push({role:'user',content:text}); c.ui.push({role:'user',text}); ta.value=''; renderChat(card);
  const btn=$('[data-act=send]',card); btn.disabled=true; btn.textContent='Waiting...';
  const r=await call(card,model,c.hist,1024);
  btn.disabled=false; btn.textContent='Send';
  const rb=$('[data-chatraw]',card); rb.hidden=false; $('pre',rb).textContent=raw(r);
  const reply=r.ok?extractText(r.json):'';
  if(reply){c.hist.push({role:'assistant',content:reply});c.ui.push({role:'bot',text:reply})}
  else{c.hist.pop();c.ui.push({err:true,text:raw(r)})}
  renderChat(card);
}

// ---------- Events ----------
document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const card=b.closest('.plat'), act=b.dataset.act;
  if(act==='ping'){
    const res=$('[data-result]',card); res.hidden=false; res.className='result wait'; $('pre',res).textContent='Pinging...';
    b.disabled=true;
    const r=await call(card,getModel(card),PING,16);
    b.disabled=false;
    res.className='result '+(r.ok?'ok':'bad'); $('pre',res).textContent=raw(r);
    setPill(card,r.ok,r.ok?'Working':'Not working');
  }
  else if(act==='testall'){
    const list=$('[data-list]',card);
    list.innerHTML=MODELS.map(m=>`<details class="wait" data-m="${m}"><summary>${m} ...</summary><pre></pre></details>`).join('');
    b.disabled=true; b.textContent='Testing...';
    let good=0;
    await pool(MODELS,3,async m=>{
      const r=await call(card,m,PING,16); if(r.ok) good++;
      const d=$(`[data-m="${m}"]`,card); d.className=r.ok?'ok':'bad';
      $('summary',d).textContent=(r.ok?'✓ ':'✗ ')+m+(r.status?'  (HTTP '+r.status+')':'  (no response)');
      $('pre',d).textContent=raw(r);
    });
    b.disabled=false; b.textContent='Test all models';
    setPill(card,good>0,good+' of '+MODELS.length+' working');
  }
  else if(act==='send') send(card);
  else if(act==='clearchat'){delete chats[card.dataset.p+'::'+getModel(card)];renderChat(card);$('[data-chatraw]',card).hidden=true}
});
document.addEventListener('change',e=>{
  const card=e.target.closest('.plat'); if(!card) return;
  const pid=card.dataset.p, f=e.target.dataset.f;
  if(f==='model'){$('[data-f=other]',card).hidden=e.target.value!=='__other';renderChat(card)}
  if(f==='other') renderChat(card);
  if(f==='remember') store.remember[pid]=e.target.checked;
  if(f==='key'||f==='remember'){
    if(store.remember[pid]) store.keys[pid]=$('[data-f=key]',card).value.trim(); else delete store.keys[pid];
  }
  save();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.matches('[data-f=msg]')){e.preventDefault();send(e.target.closest('.plat'))}
});
$('#clearAll').addEventListener('click',()=>{
  if(!confirm('Remove all saved keys and settings from this browser?')) return;
  try{localStorage.removeItem(LS)}catch{} location.reload();
});
</script>
</body>
</html>
